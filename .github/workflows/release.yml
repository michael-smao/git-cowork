name: Release

# Runs when a version tag is pushed (see `make release`).
# Builds and tests, then creates a GitHub release with the notes from CHANGELOG.md
# and the app as a zip (what install.sh and the in-app updater download).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches Info.plist
        run: |
          PLIST_VERSION="$(Scripts/version.sh)"
          if [ "v$PLIST_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match Info.plist version $PLIST_VERSION"; exit 1
          fi

      - name: Test
        run: swift test

      - name: Build app bundle
        run: make app

      # The download install.sh fetches: the signed (ad-hoc) app as a zip, plus
      # its SHA-256. ditto keeps the code signature and extended attributes intact.
      - name: Zip the app
        run: |
          ZIP="git-cowork-${GITHUB_REF_NAME#v}-macos-arm64.zip"
          ditto -c -k --keepParent dist/git-cowork.app "dist/$ZIP"
          (cd dist && shasum -a 256 "$ZIP" > "$ZIP.sha256")
          cat "dist/$ZIP.sha256"

      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {f=1; next}
            /^## \[/ {f=0}
            f' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ## Install or update

          Install or update with one line in Terminal (Apple Silicon, macOS 14+):

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | bash
          \`\`\`

          Please don't download the zip below by hand: macOS blocks apps downloaded
          in a browser. It's there for the install line and the in-app updater.

          With Homebrew: \`brew install --cask michael-smao/tap/git-cowork\`

          Or click "Update" when git-cowork tells you about this version. Built from
          source? Run \`make update\` in your git-cowork folder. More in
          [INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/INSTALL.md).
          EOF
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "git-cowork ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag \
            dist/git-cowork-*-macos-arm64.zip dist/git-cowork-*-macos-arm64.zip.sha256
