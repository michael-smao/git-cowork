name: Release

# Runs when a version tag is pushed (see `make release`).
# Builds and tests, then creates a GitHub release with the notes from CHANGELOG.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches Info.plist
        run: |
          PLIST_VERSION="$(Scripts/version.sh)"
          if [ "v$PLIST_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match Info.plist version $PLIST_VERSION"; exit 1
          fi

      - name: Test
        run: swift test

      - name: Build app bundle
        run: make app

      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {f=1; next}
            /^## \[/ {f=0}
            f' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ## Install or update

          New install: see [INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/INSTALL.md).
          Already installed: run \`make update\` in your git-cowork folder.
          EOF
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "git-cowork ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
